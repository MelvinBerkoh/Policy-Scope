<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolicyScope Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1>PolicyScope Settings</h1>
        <p class="subtitle">
          Customize highlight colors for the Big 8 categories.
        </p>
      </div>

      <div id="settingsList" class="settingsList"></div>

      <div class="actions">
        <button id="resetBtn" class="secondaryBtn">Reset Defaults</button>
        <button id="saveBtn" class="primaryBtn">Save Changes</button>
      </div>

      <p id="statusText" class="statusText"></p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
